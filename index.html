<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APEX">
  <title>APEX Training Engine</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Core External CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            main: 'var(--bg-main)',
            card: 'var(--card-bg)',
            'card-sub': 'var(--input-bg)',
            input: 'var(--input-bg)',
            sub: 'var(--border-sub)',
            accent: 'var(--accent-primary, #38bdf8)'
          },
          boxShadow: {
            accent: '0 0 15px var(--accent-glow, rgba(56, 189, 248, 0.35))'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #0f172a;
      --input-bg: #1e293b;
      --border-sub: #334155;
      --accent-primary: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --ui-scale: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: auto;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-main);
      color: #f8fafc;
      overflow: hidden;
      font-size: var(--ui-scale);
      touch-action: manipulation;
    }

    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      max-width: 64rem;
      margin: 0 auto;
      overflow: hidden;
    }

    .tactile {
      transition: transform 0.08s ease, filter 0.08s ease, opacity 0.08s ease;
      cursor: pointer;
    }

    .tactile:active {
      transform: scale(0.96);
      filter: brightness(1.15);
    }

    /* Custom App Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-sub);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
