<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APEX">
  <title>APEX Training Engine</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Core External CDN Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            main: 'var(--bg-main)',
            card: 'var(--card-bg)',
            'card-sub': 'var(--input-bg)',
            input: 'var(--input-bg)',
            sub: 'var(--border-sub)',
            accent: 'var(--accent-primary, #38bdf8)'
          },
          boxShadow: {
            accent: '0 0 15px var(--accent-glow, rgba(56, 189, 248, 0.35))'
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #0f172a;
      --input-bg: #1e293b;
      --border-sub: #334155;
      --accent-primary: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --ui-scale: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    input, textarea, select {
      user-select: auto;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh;
      background-color: var(--bg-main);
      color: #f8fafc;
      overflow: hidden;
      font-size: var(--ui-scale);
      touch-action: manipulation;
    }

    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 0.75rem;
      max-width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    .tactile {
      transition: transform 0.08s ease, filter 0.08s ease, opacity 0.08s ease;
      cursor: pointer;
    }

    .tactile:active {
      transform: scale(0.96);
      filter: brightness(1.15);
    }

    /* Custom App Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-sub);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }
  </style>
 <style id="apex-master-accent-override">
    /* 1. Text Colors: Route blues, greens, teals, purples, pinks, oranges, and ambers to Accent */
    [class*="text-sky-"],
    [class*="text-cyan-"],
    [class*="text-teal-"],
    [class*="text-emerald-"],
    [class*="text-green-"],
    [class*="text-pink-"],
    [class*="text-rose-"],
    [class*="text-indigo-"],
    [class*="text-purple-"],
    [class*="text-violet-"],
    [class*="text-blue-"],
    [class*="text-orange-"],
    [class*="text-amber-"] {
      color: var(--accent-primary) !important;
    }

    /* 2. Solid Buttons, Active Toggles & Progress Bars */
    .bg-sky-400, .bg-sky-500, .bg-sky-600,
    .bg-cyan-400, .bg-cyan-500, .bg-cyan-600,
    .bg-teal-400, .bg-teal-500, .bg-teal-600,
    .bg-emerald-400, .bg-emerald-500, .bg-emerald-600,
    .bg-green-400, .bg-green-500, .bg-green-600,
    .bg-pink-400, .bg-pink-500, .bg-pink-600,
    .bg-rose-400, .bg-rose-500, .bg-rose-600,
    .bg-indigo-400, .bg-indigo-500, .bg-indigo-600,
    .bg-purple-400, .bg-purple-500, .bg-purple-600,
    .bg-blue-400, .bg-blue-500, .bg-blue-600, .bg-blue-700,
    .bg-orange-400, .bg-orange-500, .bg-orange-600, .bg-orange-700,
    .bg-amber-400, .bg-amber-500, .bg-amber-600, .bg-amber-700 {
      background-color: var(--accent-primary) !important;
      color: #000000 !important;
    }

    /* 3. Translucent Badges & Dark Tinted Callout Boxes */
    [class*="bg-sky-"][class*="/"], [class*="bg-sky-9"],
    [class*="bg-cyan-"][class*="/"], [class*="bg-cyan-9"],
    [class*="bg-teal-"][class*="/"], [class*="bg-teal-9"],
    [class*="bg-emerald-"][class*="/"], [class*="bg-emerald-9"],
    [class*="bg-green-"][class*="/"], [class*="bg-green-9"],
    [class*="bg-pink-"][class*="/"], [class*="bg-pink-9"],
    [class*="bg-rose-"][class*="/"], [class*="bg-rose-9"],
    [class*="bg-indigo-"][class*="/"], [class*="bg-indigo-9"],
    [class*="bg-purple-"][class*="/"], [class*="bg-purple-9"],
    [class*="bg-blue-"][class*="/"], [class*="bg-blue-9"],
    [class*="bg-orange-"][class*="/"], [class*="bg-orange-9"],
    [class*="bg-amber-"][class*="/"], [class*="bg-amber-9"] {
      background-color: color-mix(in srgb, var(--accent-primary) 12%, transparent) !important;
    }

    /* 4. Borders & Focus Rings */
    [class*="border-sky-"], [class*="border-cyan-"], [class*="border-teal-"],
    [class*="border-emerald-"], [class*="border-green-"], [class*="border-pink-"],
    [class*="border-rose-"], [class*="border-indigo-"], [class*="border-purple-"],
    [class*="border-blue-"], [class*="border-orange-"], [class*="border-amber-"] {
      border-color: color-mix(in srgb, var(--accent-primary) 35%, transparent) !important;
    }

    [class*="ring-sky-"], [class*="ring-cyan-"], [class*="ring-teal-"],
    [class*="ring-emerald-"], [class*="ring-green-"], [class*="ring-indigo-"],
    [class*="ring-purple-"], [class*="ring-blue-"], [class*="ring-orange-"], [class*="ring-amber-"] {
      --tw-ring-color: color-mix(in srgb, var(--accent-primary) 50%, transparent) !important;
    }

    /* 5. Tailwind Gradients & Universal Orange/Amber Text Force */
    [class*="from-orange-"], [class*="from-amber-"],
    [class*="bg-gradient-to-r"][class*="orange"],
    [class*="bg-gradient-to-r"][class*="amber"] {
      --tw-gradient-from: var(--accent-primary) !important;
      --tw-gradient-to: color-mix(in srgb, var(--accent-primary) 70%, transparent) !important;
    }

    /* FORCE TEXT INSIDE BRIGHT ORANGE/AMBER GRADIENTS & SOLID BUTTONS TO BLACK */
  [class*="from-orange-"] *,
  [class*="from-amber-"] *,
  .bg-orange-400 *, .bg-orange-500 *, .bg-orange-600 *,
  .bg-amber-400 *, .bg-amber-500 *, .bg-amber-600 * {
    color: #000000 !important;
  }

    /* 6. Native Browser Sliders, Checkboxes & Radio Buttons */
    input[type="range"],
    input[type="checkbox"],
    input[type="radio"] {
      accent-color: var(--accent-primary) !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="./app.js?v=4.6.6"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
          reg.update();
        });
      });
    }
  </script>
</body>
</html>
